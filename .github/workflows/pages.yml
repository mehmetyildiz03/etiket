name: Doku mobile web preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doku-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/web_ocr/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Generate temporary web runner
        run: flutter create --platforms=web --project-name etiket .
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare pinned local OCR assets and test bridge
        run: |
          npm ci --prefix tool/web_ocr --ignore-scripts --no-audit --no-fund
          node scripts/prepare_web_ocr.cjs
          node --test scripts/web_ocr_bridge.test.cjs scripts/ocr_benchmark_metrics.test.cjs scripts/d4_capture_guidance.test.cjs scripts/d4_photo_quality.test.cjs scripts/private_benchmark_guard.test.cjs scripts/d4_skew_components.test.cjs
      - name: Flutter regression checks
        run: |
          flutter analyze
          flutter test
      - name: Build web for GitHub Pages project path
        run: flutter build web --release --base-href=/etiket/
      - name: Install Chromium for real OCR verification
        run: tool/web_ocr/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Read a synthetic label in the compiled browser app
        env:
          OCR_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p /tmp/doku-pages/etiket
          cp -a build/web/. /tmp/doku-pages/etiket/
          python3 -m http.server 8082 --bind 127.0.0.1 --directory /tmp/doku-pages > /tmp/doku-pages.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          # Probe Safari's image fallback before the longer multi-viewport OCR suite.
          node scripts/web_ocr_webkit_crop.cjs http://127.0.0.1:8082/etiket/
          node scripts/web_ocr_smoke.cjs http://127.0.0.1:8082/etiket/
          node scripts/web_ocr_benchmark.cjs http://127.0.0.1:8082/etiket/ --synthetic
          node scripts/web_ocr_roi_matrix.cjs http://127.0.0.1:8082/etiket/
          node scripts/web_ocr_skew_contrast_ab.cjs http://127.0.0.1:8082/etiket/
      - name: Upload browser OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doku-web-ocr-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/web-ocr-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
